name: Build and Push Kubectl Image
run-name: Build kubectl image ${{ inputs.image_version }}
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "kubectl image tag to publish (e.g. 2.2.0)"
        required: true
        type: string

jobs:
  build-kubectl-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FROM dhi.io/kubectl:1.32-debian13-dev — needs its own credentials, separate from the
      # Docker Hub login above.
      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image and push
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles/kubectl
          file: ./Dockerfiles/kubectl/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/kubectl:${{ inputs.image_version }}
