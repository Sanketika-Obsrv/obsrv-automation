name: Build and Push HMS Image
run-name: Build hms image ${{ inputs.image_version }}
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "hms image tag to publish (e.g. 2.2.0)"
        required: true
        type: string

jobs:
  build-hms-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # DHI (Docker Hardened Images) entitlement rides on the same Docker Hub account/token -
      # reuse DOCKERHUB_TOKEN instead of a separate DHI_TOKEN secret.
      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image and push
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles/hms
          file: ./Dockerfiles/hms/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/hms:${{ inputs.image_version }}
