name: Build and Push Flink Connectors Image
run-name: Build flink-connectors image ${{ inputs.image_version }}
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "flink-connectors image tag to publish (e.g. 2.2.0)"
        required: true
        type: string

jobs:
  build-flink-connectors-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Runtime stage is FROM dhi.io/eclipse-temurin:11-jdk-debian13-dev — needs its own
      # credentials, separate from the Docker Hub login above.
      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image and push
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles/flink-connectors
          file: ./Dockerfiles/flink-connectors/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/flink-connectors:${{ inputs.image_version }}
