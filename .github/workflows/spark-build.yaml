name: Build and Push Spark Image
run-name: Build spark image ${{ inputs.image_version }}
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "spark image tag to publish (e.g. 2.2.0)"
        required: true
        type: string

jobs:
  build-spark-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build/runtime stages are FROM dhi.io/python:3.12-debian13-dev and dhi.io/spark:3.5 —
      # need their own credentials, separate from the Docker Hub login above.
      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image and push
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles/spark_with_apache_livy
          file: ./Dockerfiles/spark_with_apache_livy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/spark:${{ inputs.image_version }}
