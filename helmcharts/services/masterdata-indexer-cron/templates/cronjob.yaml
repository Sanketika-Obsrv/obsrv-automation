{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-masterdata-indexer
  namespace: {{ include "base.namespace" . }}
  labels:
    {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  concurrencyPolicy: Forbid
  schedule: "{{ .Values.cronjob.cronSchedule }}"
  jobTemplate:
    metadata:
      name: spark-masterdata-indexer-job
    spec:
      template:
        metadata:
          annotations:
            {{- if .Values.podAnnotations }}
            {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 12 }}
            {{- end }}
          labels:
            {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: {{ .Values.restartPolicy }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.initContainers }}
          initContainers:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{- include "base.image" .}}"
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              {{- if .Values.livenessProbe }}
              livenessProbe:
                {{- toYaml .Values.livenessProbe | nindent 16 }}
              {{- end }}
              {{- if .Values.readinessProbe }}
              readinessProbe:
                {{- toYaml .Values.readinessProbe | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              # uid 1001 (podSecurityContext) has no writable $HOME on this image, which breaks
              # kubectl's discovery cache for any subcommand beyond the `wait` used today.
              env:
                - name: HOME
                  value: /tmp
              {{- if .Values.configmap.enabled }}
              envFrom:
                - configMapRef:
                    name: {{ include "common.names.fullname" . }}-env
              volumeMounts:
                - name: config
                  mountPath: {{ .Values.configmap.mountPath }}
              {{- end }}
              command:
                - /bin/sh
                - -c
                - |
                  {{- include "masterdata-indexer-cron.livySubmitCommand" (dict
                      "jarPath" .Values.dataproductsJar
                      "namePrefix" "masterdata-indexer"
                      "sparkHost" .Values.spark.host
                      "sparkMaster" .Values.spark.master.host
                      "driverJavaOpts" .Values.spark.driver.extraJavaOptions
                      "executorJavaOpts" .Values.spark.executor.extraJavaOptions
                      "roleArn" .Values.serviceAccountRoleArn
                    ) | nindent 18 }}
              {{- with .Values.sidecars }}
              {{- toYaml . | nindent 12 }}
              {{- end }}
          {{- if .Values.configmap.enabled }}
          volumes:
            - name: config
              configMap:
                name: {{ include "common.names.fullname" . }}
          {{- end }}
{{- end }}

