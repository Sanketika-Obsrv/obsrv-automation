apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "metastore-app.fullname" . }}-test-connection"
  labels:
    {{- include "metastore-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: "{{ .Values.testImage.registry }}/{{ .Values.testImage.repository }}:{{ .Values.testImage.tag }}"
      command: ['wget']
      args: ['{{ include "metastore-app.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
