    repository: transformer-ext
    tag: "1.4.0"
    digest: ""

  master-data-processor: &master-data-processor # registry: ""
    repository: master-data-processor
    tag: "1.4.0"
    digest: ""

  postgresql-backup: &postgresql-backup # registry: ""
