global:
  image:
    registry: &global_registry "sanketikahub"
    dockerRegistrySecretName: &dockerSecretName "registry-secret-name"
     #Replace the dockerConfigJson below for the private images
    dockerConfigJson: |-
      {"auths":{"http://registry.your-domain.io":{"auth":"eW91cl9yZWdpc3RyeV91c2VybmFtZTp5b3VyX3JlZ2lzdHJ5X3Rva2Vu"},"dhi.io":{"auth":"eW91cl9yZWdpc3RyeV91c2VybmFtZTp5b3VyX3JlZ2lzdHJ5X3Rva2Vu"}}}
  imagePullSecrets:
    - name: *dockerSecretName

imagePullSecrets: &imagePullSecrets
  - name: *dockerSecretName

# service:
#   image: "service name"
#   registry: "" # takes precedence over global registry
#   digest: "" # takes precedence over tag if specified
#   tag: "1.0.0-GA"

images: &images
  ## Obsrv Images
  command-api: &command-api
    registry: sanketikahub
    repository: obsrv-command-service
    tag: "2.2.0"
    digest: ""

