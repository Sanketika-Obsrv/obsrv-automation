    digest: ""

  web-console: &web-console
    registry: sanketikahub
    repository: "obsrv-web-console"
    tag: "2.2.0"
    digest: ""

  ## PIPELINE ENTERPRISE
  unified-pipeline: &unified-pipeline
    registry: sanketikahub
