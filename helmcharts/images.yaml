  # stock DHI kubectl is shell-less and cannot run the sh-wrapped kubectl/openssl/curl jobs.
  sanketikahub-kubectl: &sanketikahub-kubectl
    registry: sanketikahub
    repository: kubectl
    tag: "2.2.0"
    digest: ""

# Public charts like bitnami etc
# Modyfying these charts involves many changes
# Hence we are keeping their original desgin
# It enables easy upgrade in future

internal: &internal
  command-api:
    <<: *command-api
    imagePullSecrets: 
    - name: *dockerSecretName

  web-console:
    <<: *web-console
    imagePullSecrets: 
    - name: *dockerSecretName
    kubectl:
      image:
        <<: *sanketikahub-kubectl

  dataset-api:
    <<: *dataset-api
    imagePullSecrets: 
    - name: *dockerSecretName
    kubectl:
      image:
        <<: *sanketikahub-kubectl

  config-api:
    <<: *config-api
    imagePullSecrets:
    - name: *dockerSecretName
    kubectl:
      image:
        <<: *sanketikahub-kubectl

  # bootstrapper (obsrv-bootstrap / enterprise bootstrap) reads root .Values.kubectl.image
  # for the openssl+kubectl secrets job (was hardcoded sanketikahub/kubectl in the template)
  kubectl:
    image:
      <<: *sanketikahub-kubectl

  postgresql:
    image:
      <<: *postgresql
      pullSecrets:
      - name: *dockerSecretName
    volumePermissions:
      image:
        <<: *os-shell
    metrics:
      image:
        <<: *postgresql-exporter

  hms:
    imagePullSecrets:
      - name: *dockerSecretName
    image:
      <<: *hms
    test:
      image:
        <<: *os-shell

  trino:
    imagePullSecrets:
      - name: *dockerSecretName
    image:
      <<: *trino

  postgresql-backup:
    <<: *postgresql-backup
    imagePullSecrets: 
    - name: *dockerSecretName

  postgresql-exporter:
    <<: *postgresql-exporter
    imagePullSecrets: 
    - name: *dockerSecretName

  postgresql-migration:
    <<: *postgresql-migration
    imagePullSecrets: 
    - name: *dockerSecretName

  s3-exporter:
    <<: *s3-exporter
    imagePullSecrets: 
    - name: *dockerSecretName

  velero:
    image:
      <<: *velero
    imagePullSecrets:
    - *dockerSecretName
    kubectl:
      image:
        <<: *sanketikahub-kubectl
    initContainers:
      - name: velero-plugin-for-aws
        image: *velero-plugin-for-aws-image
        volumeMounts:
          - name: plugins
            mountPath: /target

  masterdata-indexer-cron:
    <<: *sanketikahub-kubectl
    imagePullSecrets:
    - name: *dockerSecretName

  valkey-dedup:
    image:
      <<: *valkey
      pullSecrets:
      - name: *dockerSecretName
    sentinel:
      image:
        <<: *valkey
    volumePermissions:
      image:
        <<: *os-shell
    kubectl:
      image:
        <<: *sanketikahub-kubectl
    metrics:
      image:
        <<: *redis-exporter

  valkey-denorm:
    image:
      <<: *valkey
      pullSecrets:
      - name: *dockerSecretName
    sentinel:
      image:
        <<: *valkey
    volumePermissions:
      image:
        <<: *os-shell
    kubectl:
      image:
        <<: *sanketikahub-kubectl
    metrics:
      image:
        <<: *redis-exporter

  loki:
    imagePullSecrets:
    - name: *dockerSecretName
    singleBinary:
      image:
        <<: *loki
    gateway:
      image:
        <<: *loki-gateway
    sidecar:
      image:
        <<: *loki-sidecar
    memcached:
      image:
        <<: *memcached
    memcachedExporter:
      image:
        <<: *memcached-exporter
    kubectlImage:
      <<: *sanketikahub-kubectl

  kubernetes-reflector:
    imagePullSecrets: 
    - name: *dockerSecretName
    image:
      <<: *kubernetes-reflector


  kube-prometheus-stack:
    prometheus:
      imagePullSecrets:
        - name: *dockerSecretName
      prometheusSpec:
        image:
          <<: *prometheus
        thanos:
          image: "dhi.io/thanos:0-debian13"
    thanosRuler:
      thanosRulerSpec:
        image: "dhi.io/thanos:0-debian13"
    kube-state-metrics:
      kubeRBACProxy:
        image:
          <<: *kube-rbac-proxy
    prometheus-node-exporter:
      kubeRBACProxy:
        image:
          <<: *kube-rbac-proxy
    alertmanager:
      imagePullSecrets:
        - name: *dockerSecretName
      alertmanagerSpec:
        image:
          <<: *alertmanager
    prometheusOperator:
      imagePullSecrets:
        - name: *dockerSecretName
      admissionWebhooks:
        patch:
          imagePullSecrets:
            - name: *dockerSecretName
          image:
            <<: *prometheus-operator-webhook
 
      image:
        <<: *prometheus-operator
 
      prometheusConfigReloader:
        image:
          <<: *prometheus-config-reloader
    grafana:
      image:
        <<: *grafana
        pullSecrets:
        - name: *dockerSecretName
      testFramework:
        <<: *grafana-test-framework
      downloadDashboardsImage:
        <<: *grafana-download-dashboards
      initChownData:
        image:
          <<: *grafana-init-chown-data
      sidecar:
        image:
          <<: *grafana-side-car
    kube-state-metrics:
      imagePullSecrets:
      - name: *dockerSecretName
      image:
        <<: *kube-state-metrics
    prometheus-node-exporter:
      imagePullSecrets:
      - name: *dockerSecretName
      image:
        <<: *prometheus-node-exporter

  prometheus-pushgateway:
    imagePullSecrets: 
    - name: *dockerSecretName
    image:
      <<: *prometheus-pushgateway
      imagePullSecrets: 
      - name: *dockerSecretName

  keycloak:
    image:
      <<: *keycloak
      pullSecrets:
      - name: *dockerSecretName
    kubectl:
      image:
        <<: *sanketikahub-kubectl

    keycloakConfigCli:
      image:
        <<: *keycloakConfigCli
        pullSecrets:
        - name: *dockerSecretName

  druid-exporter:
    image:
      <<: *druid_exporter
      pullSecrets:
      - name: *dockerSecretName
    test:
      image:
        <<: *os-shell

  druid-raw-cluster:
    <<: *druid-raw-cluster
    imagePullSecrets:
    - name: *dockerSecretName

  druid-operator:
    imagePullSecrets: 
    - name: *dockerSecretName
    image:
      <<: *druid_operator

  kafka-message-exporter:
    <<: *kafka-message-exporter
    imagePullSecrets: 
    - name: *dockerSecretName

  # kafka-exporter:
  #   image:
  #     <<: *kafka-exporter



  # kafka-connector:
  #   image:
  #     <<: *kafka-connector

  kafka40:
    image:
      <<: *kafka40
      pullSecrets:
      - name: *dockerSecretName
    metrics:
      kafka:
        image:
          <<: *kafka-exporter
      jmx:
        image:
          <<: *jmx
    defaultInitContainers:
      volumePermissions:
        image:
          <<: *os-shell
      autoDiscovery:
        image:
          <<: *sanketikahub-kubectl

  kong:
    image:
      <<: *kong
      pullSecrets:
      - *dockerSecretName
    ingressController:
      image:
        <<: *kubernetes-ingress-controller
        pullSecrets:
        - *dockerSecretName
    test:
      curl:
        image:
          <<: *curl
      httpbin:
        image:
          <<: *httpbin

  cert-manager:
    global:
      imagePullSecrets:
      - name: *dockerSecretName
    image:
      <<: *cert_manager_controller
    startupapicheck:
      image:
        <<: *cert_manager_ctl
    webhook:
      image:
        <<: *cert_manager_webhook
    cainjector:
      image:
        <<: *cert_manager_cainjector
    acmesolver:
      image:
        <<: *cert_manager_acmesolver

  spark:
    image:
      <<: *spark
      pullSecrets:
      - name: *dockerSecretName

  secor:
    <<: *secor
    imagePullSecrets:
    - name: *dockerSecretName
    exporter:
      image:
        <<: *statsd-exporter
    setPvOwnership:
      image:
        <<: *alpine

  superset:
    <<: *superset
    imagePullSecrets: 
      - name: *dockerSecretName

  flink:
    flink_jobs:
      master-data-processor:
        enabled: false
        <<: *master-data-processor
        imagePullSecrets: 
        - name: *dockerSecretName
      unified-pipeline:
        enabled: true
        <<: *unified-pipeline
        imagePullSecrets: 
        - name: *dockerSecretName
      cache-indexer:
        enabled: true
        <<: *cache-indexer
