    tag: "2-debian13"
    digest: ""

  prometheus-node-exporter: &prometheus-node-exporter
    registry: dhi.io
    repository: "node-exporter"
    tag: "1-debian13"
    digest: ""

  velero: &velero
    registry: "dhi.io"
    repository: "dhi.io/velero"
    tag: "1.16-debian13"
  #  digest: "" If uncommented, this will take precendence as per velero chart design

  superset: &superset
    registry: sanketikahub
    repository: "superset"
    tag: "2.2.0"
    digest: ""

  # DHI-hardened secor (Dockerfiles/secor/Dockerfile.hardened; eclipse-temurin JDK11 DHI base)
  secor: &secor
    registry: sanketikahub
    repository: "secor"
    tag: "2.2.0"
    digest: ""

  spark: &spark # registry: ""
    registry: sanketikahub
    repository: "spark"
