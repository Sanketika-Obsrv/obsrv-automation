    digest: ""

  prometheus-pushgateway: &prometheus-pushgateway
    # prometheus-community pushgateway chart uses image.repository as the FULL path (ignores registry)
    registry: dhi.io
    repository: dhi.io/pushgateway
    tag: 1-debian13
    digest: ""

  grafana: &grafana
    registry: dhi.io
    repository: grafana
    tag: "12.3-debian13"
    digest: ""

  grafana-test-framework: &grafana-test-framework
    registry: "dhi.io"
    repository: bats
    tag: "1-alpine3.24"
    digest: ""

  grafana-download-dashboards: &grafana-download-dashboards
    registry: dhi.io
    repository: bats
    tag: "1-alpine3.24"
    digest: ""

  grafana-init-chown-data: &grafana-init-chown-data
    registry: dhi.io
    repository: busybox
    tag: "1.37.0"
    digest: ""

  grafana-side-car: &grafana-side-car
    registry: dhi.io
    repository: k8s-sidecar
    tag: 2-debian13
    digest: ""

  kube-state-metrics: &kube-state-metrics
    registry: dhi.io
