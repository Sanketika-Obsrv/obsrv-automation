    repository: postgresql-backup
    tag: "2.2.0"
    digest: ""

  postgresql: &postgresql
    registry: "dhi.io"
    repository: "postgres"
    tag: "17-debian13"
    digest: ""

  postgresql-exporter: &postgresql-exporter
    registry: "dhi.io"
    repository: "postgres-exporter"
    tag: "0-debian13"
    digest: ""

  postgresql-migration: &postgresql-migration
    registry: "docker.io"
    repository: "flyway/flyway"
    # tag: "10.1"
    tag: "10.12.0" # updated tag - yet to be tested
    digest: ""

  volume-autoscaler: &volume-autoscaler
    registry: "docker.io"
    repository: devopsnirvana/kubernetes-volume-autoscaler
    tag: 1.0.5
    digest: ""

  # bitnami charts use an "os-shell" image only for volumePermissions init chown — DHI busybox
  # (has sh + chown) is a drop-in. Centralizes all the os-shell/volume-permissions sidecars.
  os-shell: &os-shell
    registry: "dhi.io"
    repository: "busybox"
    tag: "1.37.0"
    digest: ""

  # helm-test images (only run on `helm test`); DHI curl exists, httpbin has no DHI equivalent
  curl: &curl
    registry: "dhi.io"
    repository: "curl"
    tag: "8-debian13"
    digest: ""

  httpbin: &httpbin
    registry: "docker.io"
    repository: "kennethreitz/httpbin"
    tag: "latest"
    digest: ""

  # thanos sidecar/ruler (kube-prometheus-stack, disabled by default)
  thanos: &thanos
    registry: "dhi.io"
    repository: "thanos"
    tag: "0-debian13"
    digest: ""

  # kube-rbac-proxy sidecar (kube-state-metrics + node-exporter, when kubeRBACProxy.enabled)
  kube-rbac-proxy: &kube-rbac-proxy
    registry: "dhi.io"
    repository: "kube-rbac-proxy"
    tag: "0-debian13"
    digest: ""

  # memcached (loki chunks/results cache). loki chart uses repository as a FULL path (no registry).
  memcached: &memcached
    repository: "dhi.io/memcached"
    tag: "1-debian13"
    digest: ""

  # loki k8s-sidecar (loki chart uses repository as a FULL path, no registry field)
  loki-sidecar: &loki-sidecar
    repository: "dhi.io/k8s-sidecar"
    tag: "2.5.0"
    digest: ""

  # statsd-exporter (secor sidecar) — NO DHI image exists; centralized on upstream prom/ image
  statsd-exporter: &statsd-exporter
    registry: "docker.io"
    repository: "prom/statsd-exporter"
    tag: "v0.28.0"
    digest: ""

  # redis-exporter sidecar (valkey metrics)
  redis-exporter: &redis-exporter
    registry: "dhi.io"
    repository: "redis-exporter"
    tag: "1-debian13"
    digest: ""

  # zookeeper (druid-raw + kafka coordination). DHI upstream apache zookeeper.
  zookeeper: &zookeeper
    registry: "dhi.io"
    repository: "zookeeper"
    tag: "3.9-jre23-debian13"
    digest: ""

  # velero-plugin-for-aws — velero initContainers[].image is a plain string, so this anchor is a string
  velero-plugin-for-aws-image: &velero-plugin-for-aws-image "dhi.io/velero-plugin-for-aws:1-debian13"

  # memcached-exporter (loki cache metrics) — NO DHI; upstream prom/ (loki uses repository as full path)
  memcached-exporter: &memcached-exporter
    repository: "prom/memcached-exporter"
    tag: "v0.14.2"
    digest: ""

  # configmap-reload (promtail sidecar) — NO DHI; upstream
  configmap-reload: &configmap-reload
    registry: "docker.io"
    repository: "jimmidyson/configmap-reload"
    tag: "v0.8.0"
    digest: ""

  # minio-client (minio mc) — NO DHI; obsrv-owned
  minio-client: &minio-client
    registry: "docker.io"
    repository: "sanketikahub/minio-client"
    tag: "2024.11.7-debian-12-r0"
    digest: ""

  # alpine base (secor setPvOwnership chown init) — DHI alpine-base has shell + chown
  alpine: &alpine
    registry: "dhi.io"
    repository: "alpine-base"
    tag: "3.24-alpine3.24"
    digest: ""

  s3-exporter: &s3-exporter
    registry: "docker.io"
    repository: "ribbybibby/s3-exporter"
    tag: "latest"
    digest: ""

  promtail: &promtail
    registry: "dhi.io"
    repository: "promtail"
    tag: "3.6-debian13"
    digest: ""

  valkey: &valkey
    registry: "dhi.io"
    repository: "valkey"
    tag: "8.1-debian13"
    digest: ""
    pullSecrets:
      - name: *dockerSecretName


  # submit-ingestion: &submit-ingestion
