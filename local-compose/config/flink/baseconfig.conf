// Rendered from helmcharts/services/flink/values.yaml (baseconfig), with
// Kubernetes service DNS names replaced by docker-compose service names.

kafka {
  broker-servers = "kafka:9092"
  producer.broker-servers = "kafka:9092"
  consumer.broker-servers = "kafka:9092"
  producer {
    max-request-size = 1572864
    batch.size = 98304
    linger.ms = 10
    compression = "snappy"
  }
  output.system.event.topic = "system.events"
  output.failed.topic = "failed"
}

job {
  // Left false, matching the chart default. The local-datacenter profile flips
  // this to true against MinIO (s3://checkpoint-obsrv-local); the app code
  // expects a cloud scheme in statebackend.base.url, so false is the clean
  // local path. Flink still checkpoints to JobManager memory / local disk.
  enable.distributed.checkpointing = false
  statebackend {
    base.url = ""
  }
}

task {
  parallelism = 1
  consumer.parallelism = 1
  checkpointing.interval = 30000
  checkpointing.pause.between.seconds = 10
  restart-strategy.attempts = 3
  restart-strategy.delay = 30000 # in milli-seconds
}

redis.connection.timeout = 100

// Dedup store. Databases 1 (extractor) and 2 (preprocessor) are used.
redis {
  host = "valkey-dedup"
  port = 6379
}

// Denorm / master-data store. The per-dataset db index comes from the
// `redis_db` column in the postgres dataset registry, not from here.
redis-meta {
  host = "valkey-denorm"
  port = 6379
}

postgres {
  host = "postgres"
  port = "5432"
  maxConnections = "2"
  sslMode = "false"
  user = "obsrv"
  password = "obsrv123"
  database = "obsrv"
}

lms-cassandra {
  host = "localhost"
  port = "9042"
}

otel.collector.endpoint = "http://localhost:4317"
otel.enable = false
