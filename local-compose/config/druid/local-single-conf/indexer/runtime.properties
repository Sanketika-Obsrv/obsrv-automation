druid.service=druid/indexer
druid.plaintextPort=8091
# CHANGED FOR LOCAL: 2 -> 20. Every Kafka supervisor holds one task slot for as
# long as it is running, and the built-in system-events supervisor permanently
# occupies one -- so capacity 2 allowed exactly ONE user dataset. The second one
# created its supervisor fine and then sat in PENDING forever, which looks like
# "ingestion silently does nothing" rather than a capacity error.
# Empty slots cost nothing; the real ceiling is heap. Druid divides
# globalIngestionHeapLimitBytes below across the slots, so 512MB/20 is ~25MB of
# in-memory rows per task, which is fine at try-it-out volumes but is why this
# is 20 and not 100. Raise -Xmx in jvm.config before raising this much further.
druid.worker.capacity=20
druid.indexer.task.baseTaskDir=/druid/data/indexer/task
druid.indexer.task.restoreTasksOnRestart=true
druid.processing.buffer.sizeBytes=16MiB
druid.processing.numThreads=1
druid.processing.numMergeBuffers=1
druid.server.http.numThreads=10
druid.indexer.worker.globalIngestionHeapLimitBytes=536870912
