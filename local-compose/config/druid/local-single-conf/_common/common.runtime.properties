# Shared Druid config for all 5 roles running in the single `druid` container.
# This is a plain Druid properties file (dotted names), not env-var-translated,
# because this stack invokes `bin/start-druid -c=...` directly rather than the
# image's default /druid.sh entrypoint -- /druid.sh is the only thing in the
# image that turns druid_* env vars into properties, and it only supports one
# service per container, so it can't be used for a 5-role single container.
# Values here are the same ones the chart sets
# (helmcharts/services/druid-raw-cluster/templates/druid_statefulset.yaml:54-160),
# trimmed the same way config/druid/common.env was: no Azure/GCS extensions or
# Prometheus emitter (cloud/monitoring only), local disk instead of S3 deep
# storage (no object store in this stack).

# --- Extensions -------------------------------------------------------------
druid.extensions.loadList=["druid-basic-security","postgresql-metadata-storage","druid-kafka-indexing-service","druid-s3-extensions","druid-datasketches"]
druid.startup.logging.logProperties=true

# --- Basic auth -------------------------------------------------------------
druid.auth.enabled=true
druid.auth.authenticatorChain=["MyBasicMetadataAuthenticator"]
druid.auth.authenticator.MyBasicMetadataAuthenticator.type=basic
druid.auth.authenticator.MyBasicMetadataAuthenticator.initialAdminPassword=admin123
druid.auth.authenticator.MyBasicMetadataAuthenticator.initialInternalClientPassword=internal123
druid.auth.authenticator.MyBasicMetadataAuthenticator.credentialsValidator.type=metadata
druid.auth.authenticator.MyBasicMetadataAuthenticator.skipOnFailure=false
druid.auth.authenticator.MyBasicMetadataAuthenticator.authorizerName=MyBasicMetadataAuthorizer
druid.escalator.type=basic
druid.escalator.internalClientUsername=druid_system
druid.escalator.internalClientPassword=internal123
druid.escalator.authorizerName=MyBasicMetadataAuthorizer
druid.auth.authorizers=["MyBasicMetadataAuthorizer"]
druid.auth.authorizer.MyBasicMetadataAuthorizer.type=basic

# --- Zookeeper ----------------------------------------------------------------
druid.zk.service.host=zookeeper
druid.zk.paths.base=/druid

# --- Metadata store -----------------------------------------------------------
druid.metadata.storage.type=postgresql
druid.metadata.storage.connector.connectURI=jdbc:postgresql://postgres:5432/druid_raw
druid.metadata.storage.connector.user=druid_raw
druid.metadata.storage.connector.password=druidraw123

# --- Deep storage ---------------------------------------------------------------
# druid-deepstorage volume, shared between historical and indexer for segment handoff.
druid.storage.type=local
druid.storage.storageDirectory=/druid/deepstorage/segments
druid.indexer.logs.type=file
druid.indexer.logs.directory=/druid/deepstorage/indexing-logs

# --- Service discovery ----------------------------------------------------------
druid.selectors.indexing.serviceName=druid/overlord
druid.selectors.coordinator.serviceName=druid/coordinator

# --- Monitoring -------------------------------------------------------------------
druid.emitter=noop
druid.emitter.logging.logLevel=INFO

# --- Indexing service -----------------------------------------------------------
# runner type `remote`: the overlord hands tasks to a registered worker -- here
# the Indexer, which runs them as threads in its own JVM instead of forking a
# peon per task like MiddleManager would.
druid.indexer.runner.type=remote
druid.indexer.storage.type=metadata
druid.indexer.queue.startDelay=PT30S
druid.indexer.tasklock.forceTimeChunkLock=false

# --- Misc --------------------------------------------------------------------
druid.indexing.doubleStorage=double
druid.javascript.enabled=true
druid.sql.enable=true
