# Replaces Kong. The Kong install is DB-less (kong/values.yaml: env.database "off")
# and driven entirely by the Ingress objects in kong-ingress-routes, so there is
# no Kong-specific config to carry over.
#
# Two behaviours from those Ingresses that MUST be preserved:
#   1. No path stripping -- there is no konghq.com/strip-path anywhere in the
#      repo, so the full original path is forwarded upstream. Hence proxy_pass
#      has NO trailing slash and no rewrite.
#   2. preserve-host: "true" -> Host header passed through unchanged.
#
# Routes dropped vs the chart: /grafana -> grafana:80 and / -> superset:8088.
# Both are out of scope for a core+console stack; / redirects to /console here
# instead of Superset's catch-all.

events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Console upload/ingest payloads can be large; Kong's default is generous.
  client_max_body_size 32m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";

  server {
    listen 80;
    server_name _;

    # --- web console -------------------------------------------------------
    # Must stay under the /console prefix: the Keycloak client obsrv-console
    # registers the callback /console?auth_callback=1.
    location /console {
      proxy_pass http://web-console:3000;
    }

    # --- keycloak ----------------------------------------------------------
    location /auth {
      proxy_pass http://keycloak:8080;
    }

    # --- dataset-api -------------------------------------------------------
    location /v2/data/in/ {
      proxy_pass http://dataset-api:3000;
    }
    location /v2/data/query/ {
      proxy_pass http://dataset-api:3000;
    }
    location /v2/datasets/ {
      proxy_pass http://dataset-api:3000;
    }

    # Not routed by Kong, but needed to register connectors locally
    # (connectors/register.sh -> POST /v2/connector/register).
    location /v2/ {
      proxy_pass http://dataset-api:3000;
    }

    location = / {
      return 302 /console;
    }
  }
}
